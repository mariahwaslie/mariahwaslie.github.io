          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own

          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an

            // as real-vs-'null' rather than matching.

              UUID_SHAPE.test(d.__bundler_page) &&

            uuids.map(async (uuid) => {

                      "DecompressionStream not available, asset " +
                        uuid +

                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }

                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);

            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +

          // replace() keeps us clear of $-pattern substitution in resourceScript.

          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });

              <\u002Ful>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;\">Engineering<\u002Fdiv>\n              <ul style=\"list-style:none;\">\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan><strong style=\"color:{{ text }};\">FastAPI backend<\u002Fstrong> with Pydantic schema validation, structured logging per inference request<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan><strong style=\"color:{{ text }};\">React + TypeScript frontend<\u002Fstrong> with interactive sliders for real-time risk prediction<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan><strong style=\"color:{{ text }};\">Docker Compose<\u002Fstrong> multi-service deployment; <strong style=\"color:{{ text }};\">GitHub Actions CI<\u002Fstrong> running pytest on every push<\u002Fli>\n              <\u002Ful>\n              <div style=\"display:flex; flex-wrap:wrap; gap:5px; margin-top:14px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Python<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">CatBoost<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">FastAPI<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">React<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Docker<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">SHAP<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- RCU -->\n        <div style=\"background:{{ card }}; border:1px solid {{ border }}; border-left:3px solid #2563ff; border-radius:14px; padding:30px 34px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap;\">\n            <div>\n              <div style=\"display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; padding:3px 9px; border-radius:5px; background:#7c3aed12; color:#7c3aed;\">Production Deployment<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; padding:3px 9px; border-radius:5px; background:#059f6812; color:#059f68;\">Financial Services ML<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-weight:700; font-size:20px; letter-spacing:-0.01em; margin-bottom:4px;\">ML for Member Analytics — Royal Credit Union<\u002Fdiv>\n              <div style=\"font-size:14px; color:{{ text2 }}; max-width:640px;\">Three ML workstreams at a financial institution: org churn prediction, credit card adoption, and product recommendation. 10+ models evaluated, 2 deployed to production OracleDB.<\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"https://www.uwec.edu/stories/royal-credit-union-teams-three-campuses-ai-solutions\" target=\"_blank\" style=\"padding:7px 14px; border:1px solid {{ border }}; border-radius:8px; font-size:12px; font-weight:500; color:{{ text2 }}; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;\" style-hover=\"border-color:#2563ff; color:#2563ff;\">Press →<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px;\">\n            <div style=\"background:{{ bg2 }}; border-radius:8px; padding:10px 16px; text-align:center; min-width:100px;\"><div style=\"font-weight:800; font-size:20px;\">500K+<\u002Fdiv><div style=\"font-size:10px; color:{{ text3 }};\">member records<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:{{ bg2 }}; border-radius:8px; padding:10px 16px; text-align:center; min-width:100px;\"><div style=\"font-weight:800; font-size:20px;\">10+<\u002Fdiv><div style=\"font-size:10px; color:{{ text3 }};\">models built<\u002Fdiv><\u002Fdiv>\n            <div style=\"background:{{ bg2 }}; border-radius:8px; padding:10px 16px; text-align:center; min-width:100px;\"><div style=\"font-weight:800; font-size:20px;\">3<\u002Fdiv><div style=\"font-size:10px; color:{{ text3 }};\">deployed to prod<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n            <div>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;\">Problem<\u002Fdiv>\n              <p style=\"font-size:14px; color:{{ text2 }}; line-height:1.6;\">RCU needed three predictions: which organizations would churn, which members would adopt credit cards, and which products to recommend to specific members.<\u002Fp>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin:14px 0 8px;\">Key Challenge<\u002Fdiv>\n              <p style=\"font-size:14px; color:{{ text2 }}; line-height:1.6;\">The org churn dataset was <strong style=\"color:{{ text }};\">extremely small<\u002Fstrong> relative to the feature space. I used stratified cross-validation, aggressive regularization, and manual feature selection to prevent overfitting.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;\">Engineering &amp; Outcome<\u002Fdiv>\n              <ul style=\"list-style:none;\">\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan><strong style=\"color:{{ text }};\">Deployed 2 models to production<\u002Fstrong> via a Python pipeline loading predictions into OracleDB<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>EDA using ggplot2, Tidyverse, Matplotlib, Pandas; Power BI for data discovery<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>Presented findings to stakeholders; Agile sprint planning via Azure DevOps<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>Work <strong style=\"color:{{ text }};\">featured in a UW-Eau Claire news article<\u002Fstrong><\u002Fli>\n              <\u002Ful>\n              <div style=\"display:flex; flex-wrap:wrap; gap:5px; margin-top:14px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Python<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">R<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Oracle SQL<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">XGBoost<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Power BI<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Clinical Risk -->\n        <div style=\"background:{{ card }}; border:1px solid {{ border }}; border-left:3px solid #2563ff; border-radius:14px; padding:30px 34px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:22px; flex-wrap:wrap;\">\n            <div>\n              <div style=\"display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; padding:3px 9px; border-radius:5px; background:#2563ff10; color:#2563ff;\">Backend · FHIR · Java<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; padding:3px 9px; border-radius:5px; background:#059f6812; color:#059f68;\">ML<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:500; padding:3px 9px; border-radius:5px; background:#d9770612; color:#d97706;\">◐ In Progress<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-weight:700; font-size:20px; letter-spacing:-0.01em; margin-bottom:4px;\">Clinical Risk Platform — FHIR-Compliant Healthcare System<\u002Fdiv>\n              <div style=\"font-size:14px; color:{{ text2 }}; max-width:640px;\">Multi-service healthcare platform: Java/Spring Boot API following FHIR interoperability standards, Python ML service for clinical deterioration prediction, with Docker and CI/CD.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:24px;\">\n            <div>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;\">Problem &amp; Architecture<\u002Fdiv>\n              <p style=\"font-size:14px; color:{{ text2 }}; line-height:1.6;\">Healthcare systems need early warning for patient deterioration, but clinical data follows strict interoperability standards (HL7 FHIR). I'm structuring all data as proper <strong style=\"color:{{ text }};\">FHIR resources<\u002Fstrong> with <strong style=\"color:{{ text }};\">LOINC and ICD-10 coding<\u002Fstrong> — the same standards used by Epic and Cerner.<\u002Fp>\n              <p style=\"font-size:14px; color:{{ text2 }}; line-height:1.6; margin-top:10px;\">Completed: Spring Boot REST API with FHIR endpoints and JWT auth, data loading from Synthea. Planned: LightGBM deterioration prediction, PySpark pipeline into Snowflake, BI dashboards.<\u002Fp>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ text3 }}; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;\">Why This Architecture<\u002Fdiv>\n              <ul style=\"list-style:none;\">\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>FHIR because every major EHR vendor now exposes data through FHIR APIs — this is how production healthcare data works<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>Java/Spring Boot for the API layer — the standard for healthcare enterprise systems<\u002Fli>\n                <li style=\"font-size:13px; color:{{ text2 }}; padding:4px 0 4px 16px; position:relative; line-height:1.5;\"><span style=\"position:absolute; left:0; color:#2563ff; font-weight:600;\">→<\u002Fspan>Separate Python ML service isolates inference from the API, follows microservice best practices<\u002Fli>\n              <\u002Ful>\n              <div style=\"display:flex; flex-wrap:wrap; gap:5px; margin-top:14px;\">\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Java<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Spring Boot<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">FHIR<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">PostgreSQL<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; background:{{ chipBg }}; border:1px solid {{ border }}; border-radius:5px; color:{{ text2 }};\">Docker<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr style=\"border:none; border-top:1px solid {{ border }};\">\n\n  <section style=\"padding:76px 0; max-width:1080px; margin:0 auto;\">\n    <div style=\"padding:0 28px;\">\n      <div style=\"font-family:'Inter',sans-serif; font-size:12px; font-weight:700; color:#2563ff; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;\">More Work<\u002Fdiv>\n      <h2 style=\"font-weight:700; font-size:clamp(24px,3.5vw,32px); letter-spacing:-0.02em; margin-bottom:28px;\">Other projects.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px;\">\n        <div style=\"background:{{ card }}; border:1px solid {{ border }}; border-radius:12px; padding:22px;\">\n          <div style=\"display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:500; padding:3px 8px; border-radius:5px; background:#059f6812; color:#059f68;\">GenAI / RAG<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:500; padding:3px 8px; border-radius:5px; background:#059f6812; color:#059f68;\">● Live<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-weight:600; font-size:15px; margin-bottom:7px;\">AI Reading Companion<\u002Fdiv>\n          <div style=\"font-size:13px; color:{{ text2 }}; line-height:1.5; margin-bottom:14px;\">Deployed RAG application — upload documents, get source-grounded answers with citation verification. Full retrieval pipeline with LangChain, ChromaDB, and LLM APIs.<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">Python<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">LangChain<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">ChromaDB<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://ai-reading-companion.streamlit.app\" target=\"_blank\" style=\"font-size:12px; font-weight:500; color:#2563ff; display:inline-flex; align-items:center; gap:4px;\" style-hover=\"text-decoration:underline;\">Live demo →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background:{{ card }}; border:1px solid {{ border }}; border-radius:12px; padding:22px;\">\n          <div style=\"display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:500; padding:3px 8px; border-radius:5px; background:#2563ff10; color:#2563ff;\">Cloud · Serverless<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-weight:600; font-size:15px; margin-bottom:7px;\">AWS Serverless Quiz Pipeline<\u002Fdiv>\n          <div style=\"font-size:13px; color:{{ text2 }}; line-height:1.5; margin-bottom:14px;\">Infrastructure as Code with AWS CDK (Java). S3 upload triggers Lambda → Transcribe → Bedrock LLM generates quiz → JSON to S3.<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">Java<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">AWS CDK<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">Bedrock<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://github.com/mariahwaslie\" target=\"_blank\" style=\"font-size:12px; font-weight:500; color:#2563ff; display:inline-flex; align-items:center; gap:4px;\" style-hover=\"text-decoration:underline;\">Source code →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"background:{{ card }}; border:1px solid {{ border }}; border-radius:12px; padding:22px;\">\n          <div style=\"display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:500; padding:3px 8px; border-radius:5px; background:#7c3aed12; color:#7c3aed;\">Reinforcement Learning<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-weight:600; font-size:15px; margin-bottom:7px;\">MLFQ Scheduler with DQN<\u002Fdiv>\n          <div style=\"font-size:13px; color:{{ text2 }}; line-height:1.5; margin-bottom:14px;\">Deep Q-Network that learns CPU scheduling decisions in a Multi-Level Feedback Queue simulator, compared against traditional MLFQ algorithms using PyTorch.<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:4px; margin-bottom:14px;\">\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">Python<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">PyTorch<\u002Fspan>\n            <span style=\"font-family:'JetBrains Mono',monospace; font-size:10px; padding:3px 7px; background:{{ chipBg }}; border-radius:4px; color:{{ text3 }};\">DQN<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://github.com/mariahwaslie\" target=\"_blank\" style=\"font-size:12px; font-weight:500; color:#2563ff; display:inline-flex; align-items:center; gap:4px;\" style-hover=\"text-decoration:underline;\">Source code →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <hr style=\"border:none; border-top:1px solid {{ border }};\">\n\n  <section id=\"about\" style=\"padding:76px 0; max-width:1080px; margin:0 auto;\">\n    <div style=\"padding:0 28px;\">\n      <div style=\"font-family:'Inter',sans-serif; font-size:12px; font-weight:700; color:#2563ff; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:8px;\">About<\u002Fdiv>\n      <h2 style=\"font-weight:700; font-size:clamp(24px,3.5vw,32px); letter-spacing:-0.02em; margin-bottom:32px;\">The short version.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:1.3fr 1fr; gap:40px;\">\n        <div>\n          <p style=\"font-size:15px; color:{{ text2 }}; margin-bottom:14px; line-height:1.7;\">I gravitate toward the <strong style=\"color:{{ text }};\">hard part of ML engineering<\u002Fstrong> — messy data, rigorous evaluation, data leakage prevention, and whether a model actually works once it's deployed. I care equally about the <strong style=\"color:{{ text }};\">backend systems<\u002Fstrong> that serve predictions and the <strong style=\"color:{{ text }};\">data pipelines<\u002Fstrong> that feed them.<\u002Fp>\n          <p style=\"font-size:15px; color:{{ text2 }}; margin-bottom:14px; line-height:1.7;\">At <strong style=\"color:{{ text }};\">Royal Credit Union<\u002Fstrong>, I built ML models across three workstreams — organizational churn, credit card adoption, and product recommendation — evaluating 10+ model architectures, deploying 2 to production, serving 500K+ members. The work was <strong style=\"color:{{ text }};\">featured in a university news article<\u002Fstrong>.<\u002Fp>\n          <p style=\"font-size:15px; color:{{ text2 }}; margin-bottom:14px; line-height:1.7;\">More recently I've been operating a level up the stack: as founder of <strong style=\"color:{{ text }};\">Remmebr<\u002Fstrong>, I own the product vision and system architecture, and direct AI-assisted development to turn specs into shipped features — the same rigor I apply to model evaluation, applied to product decisions, code review, and release readiness. I finish my dual degree at UW–River Falls this August.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:{{ factsBg }}; color:{{ factsT }}; border-radius:14px; padding:22px; height:fit-content;\">\n          <h3 style=\"font-family:'Inter',sans-serif; font-size:11px; font-weight:700; color:{{ factsDim }}; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid {{ factsB }};\">Quick facts<\u002Fh3>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid {{ factsB }};\"><span style=\"font-size:12px; color:{{ factsDim }};\">Degree<\u002Fspan><span style=\"font-size:12px; font-weight:600; text-align:right;\">B.S. CS &amp; Data Science<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid {{ factsB }};\"><span style=\"font-size:12px; color:{{ factsDim }};\">School<\u0
